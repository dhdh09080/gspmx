<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>근로자 정보변경 신청</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--brand:#1f5eff;--brand2:#1748c8;--danger:#b42318}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
    .wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
    .top{margin-bottom:22px}.brand{font-weight:800;font-size:22px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(16,24,40,.05);padding:24px}
    .hero{margin-bottom:18px}.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0;color:var(--muted);line-height:1.6}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}
    label{font-weight:800;font-size:14px}.req{color:var(--danger)}
    input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:12px;background:#fff;padding:13px 14px;font-size:16px;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,94,255,.12)}
    textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:var(--muted)}
    .combo{position:relative}.combo-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#fff;border:1px solid #d0d5dd;border-radius:12px;box-shadow:0 10px 30px rgba(16,24,40,.14);max-height:260px;overflow:auto;display:none}.combo-list.open{display:block}.combo-item{padding:11px 13px;cursor:pointer;border-bottom:1px solid #f2f4f7;font-size:15px}.combo-item:hover,.combo-item.active{background:#f2f6ff}.combo-item .cat{color:var(--muted);font-size:12px;margin-left:6px}.combo-empty{padding:14px;color:var(--muted)}
    .actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--brand);color:#fff}.primary:hover{background:var(--brand2)}.secondary{background:#eef2f7;color:#344054}
    .notice{margin-top:16px;padding:13px 14px;border-radius:12px;background:#f2f4f7;color:#475467;font-size:13px;line-height:1.5}
    .hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.hero h1{font-size:24px}.card{padding:18px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">성동자이리버뷰 · 근로자 정보변경</div></div>
  <section class="card">
    <div class="hero">
      <h1>근로자 정보변경 신청</h1>
      <p>업체 변경, 퇴직→재직, 재직→퇴직 요청을 신청할 수 있습니다.</p>
    </div>
    <form id="requestForm">
      <div class="grid">
        <div class="field full">
          <label>요청 유형 <span class="req">*</span></label>
          <select id="requestType" required>
            <option value="company_change">업체 변경</option>
            <option value="retired_to_active">퇴직 → 재직</option>
            <option value="active_to_retired">재직 → 퇴직</option>
          </select>
        </div>
        <div class="field"><label>요청자 이름 <span class="req">*</span></label><input id="requesterName" maxlength="30" placeholder="예: 김현장" required></div>
        <div class="field"><label>근로자 이름 <span class="req">*</span></label><input id="workerName" maxlength="30" placeholder="예: 홍길동" required></div>
        <div class="field"><label>전화번호 뒷 4자리 <span class="req">*</span></label><input id="phone4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="예: 1234" required><div class="hint">휴대전화번호 전체는 입력하지 않습니다.</div></div>
        <div class="field"><label>현재 업체 <span class="req">*</span></label><div class="combo"><input id="currentCompanyText" type="text" placeholder="업체명을 입력하세요" autocomplete="off" required><input id="currentCompany" type="hidden"><div id="currentCompanyList" class="combo-list"></div></div><div class="hint">일부 글자를 입력한 뒤 Enter를 누르면 선택됩니다.</div></div>
        <div id="targetCompanyField" class="field"><label>변경할 업체 <span class="req">*</span></label><div class="combo"><input id="targetCompanyText" type="text" placeholder="업체명을 입력하세요" autocomplete="off"><input id="targetCompany" type="hidden"><div id="targetCompanyList" class="combo-list"></div></div><div class="hint">업체 변경 요청일 때만 입력합니다.</div></div>
        <div class="field full"><label>변경 사유 <span class="req">*</span></label><textarea id="reason" maxlength="300" placeholder="변경 사유를 입력해주세요." required></textarea><div class="hint"><span id="reasonCount">0</span>/300자</div></div>
      </div>
      <div class="actions"><button id="submitBtn" class="btn primary" type="submit">변경 신청하기</button><button class="btn secondary" type="reset">다시 작성</button></div>
      <div class="notice">신청 내용은 현장 담당자가 확인한 뒤 PMX에서 처리합니다.</div>
    </form>
  </section>
</div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://zobflntvegpunktphauf.supabase.co';
const SUPABASE_KEY=['sb_publishable_','jkKjWb-Dl_x-IyEqmEYeGA_xdqh5tjj'].join('');
const API_HEADERS={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
let companies=[];
const $=s=>document.querySelector(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function loadCompanies(){const r=await fetch(`${SUPABASE_URL}/rest/v1/worker_change_companies?select=ptnco_cd,ptnco_nm,category&is_active=eq.true&order=ptnco_nm.asc`,{headers:API_HEADERS});if(!r.ok)throw new Error('업체 목록을 불러오지 못했습니다.');companies=await r.json();}
function companyLabel(c){const dup=companies.filter(x=>x.ptnco_nm===c.ptnco_nm).length>1;return `${c.ptnco_nm}${dup&&c.category?` (${c.category})`:''}`;}
function setupCompanyCombo(textSel,valueSel,listSel){const input=$(textSel),hidden=$(valueSel),list=$(listSel);let matches=[],active=-1;const render=()=>{const q=input.value.trim().toLowerCase();matches=companies.filter(c=>!q||c.ptnco_nm.toLowerCase().includes(q)||(c.category||'').toLowerCase().includes(q)).slice(0,40);active=matches.length?0:-1;list.innerHTML=matches.length?matches.map((c,i)=>`<div class="combo-item ${i===active?'active':''}" data-code="${esc(c.ptnco_cd)}"><strong>${esc(c.ptnco_nm)}</strong>${c.category?`<span class="cat">${esc(c.category)}</span>`:''}</div>`).join(''):'<div class="combo-empty">일치하는 업체가 없습니다.</div>';list.classList.add('open');};const choose=c=>{if(!c)return;hidden.value=c.ptnco_cd;input.value=companyLabel(c);list.classList.remove('open');};input.addEventListener('focus',render);input.addEventListener('input',()=>{hidden.value='';render();});input.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,matches.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0)}else if(e.key==='Enter'){if(list.classList.contains('open')){e.preventDefault();choose(matches.find(c=>companyLabel(c)===input.value.trim()||c.ptnco_nm===input.value.trim())||matches[active]||matches[0]);}return}else if(e.key==='Escape'){list.classList.remove('open');return}else return;[...list.querySelectorAll('.combo-item')].forEach((el,i)=>el.classList.toggle('active',i===active));});list.addEventListener('mousedown',e=>{const item=e.target.closest('.combo-item');if(!item)return;e.preventDefault();choose(companies.find(c=>c.ptnco_cd===item.dataset.code));});document.addEventListener('mousedown',e=>{if(!input.closest('.combo').contains(e.target))list.classList.remove('open');});return{reset(){input.value='';hidden.value='';list.classList.remove('open')}};}
let currentCombo,targetCombo;
function updateRequestTypeUI(){const isCompany=$('#requestType').value==='company_change';$('#targetCompanyField').classList.toggle('hidden',!isCompany);$('#targetCompanyText').required=isCompany;if(!isCompany)targetCombo?.reset();}
async function submitRequest(e){e.preventDefault();const type=$('#requestType').value;const current=companies.find(c=>c.ptnco_cd===$('#currentCompany').value);const target=companies.find(c=>c.ptnco_cd===$('#targetCompany').value);if(!current){toast('현재 업체를 검색 후 Enter로 선택해주세요.');return}if(type==='company_change'&&!target){toast('변경할 업체를 검색 후 Enter로 선택해주세요.');return}if(type==='company_change'&&current.ptnco_cd===target.ptnco_cd){toast('현재 업체와 변경할 업체가 같습니다.');return}const body={request_type:type,requester_name:$('#requesterName').value.trim(),worker_name:$('#workerName').value.trim(),phone4:$('#phone4').value.trim(),current_company_cd:current.ptnco_cd,current_company_nm:current.ptnco_nm,target_company_cd:type==='company_change'?target.ptnco_cd:null,target_company_nm:type==='company_change'?target.ptnco_nm:null,reason:$('#reason').value.trim(),status:'pending'};$('#submitBtn').disabled=true;$('#submitBtn').textContent='신청 중...';try{const r=await fetch(`${SUPABASE_URL}/rest/v1/worker_change_requests`,{method:'POST',headers:{...API_HEADERS,'Prefer':'return=minimal'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());toast('신청이 완료되었습니다.');e.target.reset();currentCombo.reset();targetCombo.reset();$('#reasonCount').textContent='0';updateRequestTypeUI();}catch(err){console.error(err);toast('신청 저장에 실패했습니다. 다시 시도해주세요.');}finally{$('#submitBtn').disabled=false;$('#submitBtn').textContent='변경 신청하기';}}
$('#requestType').addEventListener('change',updateRequestTypeUI);
$('#reason').addEventListener('input',e=>$('#reasonCount').textContent=e.target.value.length);
$('#requestForm').addEventListener('submit',submitRequest);
$('#requestForm').addEventListener('reset',()=>setTimeout(()=>{currentCombo.reset();targetCombo.reset();$('#reasonCount').textContent='0';updateRequestTypeUI()},0));
(async()=>{try{await loadCompanies();currentCombo=setupCompanyCombo('#currentCompanyText','#currentCompany','#currentCompanyList');targetCombo=setupCompanyCombo('#targetCompanyText','#targetCompany','#targetCompanyList');updateRequestTypeUI();}catch(e){console.error(e);toast('업체 목록 로딩에 실패했습니다.');}})();
</script>
</body>
</html>
